name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - run: go test -v -race ./...
      - run: make cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: cli

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  release:
    needs: [test, lint, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: extension
      - name: Check that the extension version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(bun -e 'console.log(JSON.parse(await Bun.file("extension/manifest.json").text()).version)')"
          test "$tag" = "$manifest" || { echo "tag $tag but manifest.json has $manifest"; exit 1; }
      - run: make ext-xpi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
